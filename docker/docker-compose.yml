services:
  postgres:
    image: postgres:18-bookworm
    command:
      - postgres
      # Bounds how long a session may sit idle inside a transaction. Derived by
      # rule, not by intuition:
      #     timeout = max(60s, round_up_to_30s(4 x observed))
      # where `observed` is the worst idle-in-transaction gap measured across the
      # backend suite and a live stack. Measured: 6.07s (one xdist worker during a
      # full `pytest -n auto` run -- a fixture holding a session open across
      # awaits), while the live stack's production database peaked at 0.04s over
      # 45 minutes. So 4 x 6.07 = 24.3s -> rounds to 30s -> the 60s floor wins.
      # Re-measure and re-apply that formula before changing this value: the ~10x
      # headroom this happens to leave over the suite is an outcome of the rule at
      # one data point, not the rule itself.
      #
      # The outbox poller's GAP_RETIREMENT_SEC (backend/app/events/event_bus.py) is
      # derived from this value: a system_events sequence value cannot stay
      # unresolved longer than the transaction holding it, so this is what makes
      # time-based gap retirement principled instead of arbitrary. Deliberately a
      # literal, not an env override:
      # backend/tests/contracts/test_compose_config.py pins both files to the same
      # value and pins the constant to it. Note that the control-plane leader's
      # advisory-lock session is `idle`, not `idle in transaction`, so this does
      # not disturb it.
      - -c
      - idle_in_transaction_session_timeout=60s
    environment:
      POSTGRES_USER: gridfleet
      POSTGRES_PASSWORD: gridfleet
      POSTGRES_DB: gridfleet
    ports:
      - "5432:5432"
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridfleet"]
      interval: 5s
      timeout: 5s
      retries: 5

  router:
    build:
      context: ..
      dockerfile: router/Dockerfile
    ports:
      - "4444:4444"
    environment:
      GRIDFLEET_ROUTER_LISTEN: 0.0.0.0:4444
      GRIDFLEET_ROUTER_BACKEND: http://backend:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      GRIDFLEET_DATABASE_URL: postgresql+asyncpg://gridfleet:gridfleet@postgres:5432/gridfleet
      # API-serving worker processes; background loops run in-process here (dev
      # keeps GRIDFLEET_RUN_BACKGROUND_LOOPS at its true default). Each worker
      # opens its own DB pool, so keep WORKERS x (DB pool 10 + overflow 20) under
      # Postgres max_connections (100).
      GRIDFLEET_UVICORN_WORKERS: ${GRIDFLEET_UVICORN_WORKERS:-1}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - driver-pack-storage:/var/lib/gridfleet/driver-packs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - debug

volumes:
  pgdata18:
  driver-pack-storage:
